name: Spec Tracker

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/request-for-change/plans/**'
      - 'docs/system-specs/common/spec-driven-development.md'
      - 'scripts/spec_tracker.py'
      - 'test/test_spec_tracker.py'
      - '.github/workflows/spec-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate plans and preserve checkpoint history
        env:
          SPEC_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python3 scripts/spec_tracker.py check --base "$SPEC_BASE_REF"
