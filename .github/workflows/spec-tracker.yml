name: Custom Layer

on:
  pull_request:
    paths:
      - 'custom/**'
      - 'src/kiro_crew/**'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'AGENTS.md'
      - '.github/workflows/spec-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install core and local custom package
        run: python -m pip install -e '.[dev]' -e './custom[bedrock]'
      - name: Validate plans and preserve checkpoint history
        env:
          SPEC_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python custom/scripts/spec_tracker.py check --base "$SPEC_BASE_REF"
      - name: Run custom tests with repository host isolation
        run: python -m pytest -c setup.cfg -n0 custom/tests
      - name: Verify core integration contracts
        run: python -m pytest -n0 test/test_harness_parity.py test/test_provider_mirrors.py test/test_agent_sdk_backend_install.py test/test_backend_cards.py test/test_agent_host_contract_parity.py
