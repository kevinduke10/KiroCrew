<!doctype html>
<html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kiro Crew</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body><main><header><div><h1 data-i18n="title"></h1><p data-i18n="intro"></p></div><button id="login" data-i18n="signIn"></button><button id="logout" data-i18n="signOut" hidden></button></header><p id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><p id="role"></p><div class="columns"><section><h2 data-i18n="companies"></h2><button id="reload" data-i18n="load"></button><ul id="companies"></ul><button id="more" data-i18n="more" hidden></button><form id="create" hidden><h2 data-i18n="create"></h2><label><span data-i18n="name"></span><input name="name" required maxlength="120"></label><button data-i18n="create"></button></form></section>
<section><p id="choose" data-i18n="choose"></p><h2 id="selected"></h2><form id="settings" hidden><label><span data-i18n="name"></span><input name="name" required maxlength="120"></label><label><input name="active" type="checkbox"><span data-i18n="active"></span></label><button data-i18n="save"></button></form><form id="invite" hidden><h2 data-i18n="invite"></h2><label><span data-i18n="email"></span><input name="email" type="email" required maxlength="254"></label><label><span data-i18n="role"></span><select name="role"><option value="member" data-i18n="member_role"></option><option value="company_admin" data-i18n="company_admin"></option></select></label><button data-i18n="send"></button></form><form id="company-role" hidden><h2 data-i18n="companyMembership"></h2><p data-i18n="ownerTransferHint"></p><label><span data-i18n="memberSubject"></span><input name="subject" required pattern="[A-Za-z0-9_-]{1,128}"></label><label><span data-i18n="role"></span><select name="role"><option value="member" data-i18n="member_role"></option><option value="company_admin" data-i18n="company_admin"></option><option value="company_owner" data-i18n="company_owner"></option></select></label><label><input name="active" type="checkbox" checked><span data-i18n="membershipActive"></span></label><button data-i18n="saveCompanyRole"></button></form></section></div></section>
</main></body></html>
